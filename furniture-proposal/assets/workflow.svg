<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="580" viewBox="0 0 1280 580" role="img" aria-label="家具使用空間預演器使用流程"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#697b71"/></marker><pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse"><path d="M25 0H0V25" fill="none" stroke="#e5e9e0" stroke-width=".7"/></pattern><pattern id="conflict" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#f5a996"/><line x1="0" y1="0" x2="0" y2="7" stroke="#cb5c44" stroke-width="2"/></pattern></defs><g font-family="Noto Sans CJK TC, sans-serif"><rect x="0" y="0" width="1280" height="580" rx="0" fill="#f7f6f0" stroke="none" /><text x="40" y="48" font-size="28" fill="#274c3e" font-weight="700" text-anchor="start" >從量尺寸，到做出更合適的配置</text><text x="40" y="82" font-size="17" fill="#697b71" font-weight="400" text-anchor="start" >操作流程概念圖</text><rect x="40" y="135" width="370" height="130" rx="16" fill="white" stroke="#d9e1d8" /><rect x="60" y="153" width="44" height="32" rx="10" fill="#edf2e8" stroke="none" /><text x="82" y="176" font-size="16" fill="#274c3e" font-weight="700" text-anchor="middle" >01</text><text x="60" y="217" font-size="22" fill="#263c34" font-weight="600" text-anchor="start" >建立房間與家具</text><text x="60" y="245" font-size="15" fill="#697b71" font-weight="400" text-anchor="start" >輸入長寬、尺寸與使用範圍</text><rect x="455" y="135" width="370" height="130" rx="16" fill="white" stroke="#d9e1d8" /><rect x="475" y="153" width="44" height="32" rx="10" fill="#edf2e8" stroke="none" /><text x="497" y="176" font-size="16" fill="#274c3e" font-weight="700" text-anchor="middle" >02</text><text x="475" y="217" font-size="22" fill="#263c34" font-weight="600" text-anchor="start" >拖曳擺放與旋轉</text><text x="475" y="245" font-size="15" fill="#697b71" font-weight="400" text-anchor="start" >每次 90°，方向隨家具更新</text><rect x="870" y="135" width="370" height="130" rx="16" fill="white" stroke="#d9e1d8" /><rect x="890" y="153" width="44" height="32" rx="10" fill="#edf2e8" stroke="none" /><text x="912" y="176" font-size="16" fill="#274c3e" font-weight="700" text-anchor="middle" >03</text><text x="890" y="217" font-size="22" fill="#263c34" font-weight="600" text-anchor="start" >切換使用狀態</text><text x="890" y="245" font-size="15" fill="#697b71" font-weight="400" text-anchor="start" >比較收起與展開所需空間</text><rect x="870" y="355" width="370" height="130" rx="16" fill="white" stroke="#d9e1d8" /><rect x="890" y="373" width="44" height="32" rx="10" fill="#edf2e8" stroke="none" /><text x="912" y="396" font-size="16" fill="#274c3e" font-weight="700" text-anchor="middle" >04</text><text x="890" y="437" font-size="22" fill="#263c34" font-weight="600" text-anchor="start" >檢查空間衝突</text><text x="890" y="465" font-size="15" fill="#697b71" font-weight="400" text-anchor="start" >標出越界、阻擋與共用空間</text><rect x="455" y="355" width="370" height="130" rx="16" fill="white" stroke="#d9e1d8" /><rect x="475" y="373" width="44" height="32" rx="10" fill="#edf2e8" stroke="none" /><text x="497" y="396" font-size="16" fill="#274c3e" font-weight="700" text-anchor="middle" >05</text><text x="475" y="437" font-size="22" fill="#263c34" font-weight="600" text-anchor="start" >調整與再次確認</text><text x="475" y="465" font-size="15" fill="#697b71" font-weight="400" text-anchor="start" >移動位置，重新檢查配置</text><rect x="40" y="355" width="370" height="130" rx="16" fill="white" stroke="#d9e1d8" /><rect x="60" y="373" width="44" height="32" rx="10" fill="#edf2e8" stroke="none" /><text x="82" y="396" font-size="16" fill="#274c3e" font-weight="700" text-anchor="middle" >06</text><text x="60" y="437" font-size="22" fill="#263c34" font-weight="600" text-anchor="start" >保存與匯出</text><text x="60" y="465" font-size="15" fill="#697b71" font-weight="400" text-anchor="start" >瀏覽器保存／JSON／圖片</text><line x1="410" y1="200" x2="450" y2="200" stroke="#697b71" stroke-width="2" marker-end="url(#arrow)"/><line x1="825" y1="200" x2="865" y2="200" stroke="#697b71" stroke-width="2" marker-end="url(#arrow)"/><line x1="1055" y1="265" x2="1055" y2="349" stroke="#697b71" stroke-width="2" marker-end="url(#arrow)"/><line x1="870" y1="420" x2="830" y2="420" stroke="#697b71" stroke-width="2" marker-end="url(#arrow)"/><line x1="455" y1="420" x2="415" y2="420" stroke="#697b71" stroke-width="2" marker-end="url(#arrow)"/><path d="M640 355V310H640V270" fill="none" stroke="#d48a69" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arrow)"/><text x="655" y="316" font-size="14" fill="#aa684c" font-weight="400" text-anchor="start" >需要時回到擺放步驟</text><line x1="40" y1="528" x2="1240" y2="528" stroke="#d9e1d8" /><text x="40" y="557" font-size="16" fill="#697b71" font-weight="400" text-anchor="start" >資料可由使用者手動量測與輸入；程式負責操作、判斷及呈現。</text></g></svg>