<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="580" viewBox="0 0 1280 580" role="img" aria-label="家具使用空間預演器系統架構"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#697b71"/></marker><pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse"><path d="M25 0H0V25" fill="none" stroke="#e5e9e0" stroke-width=".7"/></pattern><pattern id="conflict" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#f5a996"/><line x1="0" y1="0" x2="0" y2="7" stroke="#cb5c44" stroke-width="2"/></pattern></defs><g font-family="Noto Sans CJK TC, sans-serif"><rect x="0" y="0" width="1280" height="580" rx="0" fill="#f7f6f0" stroke="none" /><text x="40" y="48" font-size="28" fill="#274c3e" font-weight="700" text-anchor="start" >資料如何變成看得懂的空間提醒</text><text x="40" y="82" font-size="17" fill="#697b71" font-weight="400" text-anchor="start" >系統架構概念圖｜HTML、CSS、JavaScript 與 SVG</text><rect x="40" y="240" width="260" height="115" rx="16" fill="white" stroke="#d9e1d8" /><text x="170.0" y="283" font-size="22" fill="#274c3e" font-weight="600" text-anchor="middle" >房間與家具輸入</text><text x="170.0" y="314" font-size="14" fill="#697b71" font-weight="400" text-anchor="middle" >尺寸、位置、使用範圍</text><rect x="380" y="240" width="260" height="115" rx="16" fill="white" stroke="#d9e1d8" /><text x="510.0" y="283" font-size="22" fill="#274c3e" font-weight="600" text-anchor="middle" >配置資料模型</text><text x="510.0" y="314" font-size="14" fill="#697b71" font-weight="400" text-anchor="middle" >統一座標、旋轉與狀態</text><rect x="735" y="130" width="225" height="110" rx="16" fill="white" stroke="#d9e1d8" /><text x="847.5" y="173" font-size="22" fill="#274c3e" font-weight="600" text-anchor="middle" >SVG 平面圖</text><text x="847.5" y="204" font-size="14" fill="#697b71" font-weight="400" text-anchor="middle" >拖曳、比例繪圖與切換</text><rect x="735" y="355" width="22