ke="none" /><text x="702" y="652" font-size="15" fill="#274c3e" font-weight="600" text-anchor="start" >綠色虛線：使用範圍內沒有其他家具阻擋</text><text x="40" y="724" font-size="30" fill="#274c3e" font-weight="700" text-anchor="start" >60 cm</text><text x="40" y="752" font-size="15" fill="#697b71" font-weight="400" text-anchor="start" >抽屜需要拉出</text><text x="350" y="724" font-size="30" fill="#697b71" font-weight="700" text-anchor="start" >40 cm</text><text x="350" y="752" font-size="15" fill="#697b71" font-weight="400" text-anchor="start" >原配置前方淨空</text><text x="660" y="724" font-size="30" fill="#d96750" font-weight="700" text-anchor="start" >20 cm</text><text x="660" y="752" font-size="15" fill="#697b71" font-weight="400" text-anchor="start" >原配置空間不足</text><rect x="990" y="698" width="16" height="16" rx="3" fill="#7c9a84" stroke="none" /><text x="1015" y="712" font-size="14" fill="#697b71" font-weight="400" text-anchor="start" >家具本體</text><rect x="990" y="728" width="16" height="16" rx="3" fill="#e6f2df" stroke="#5f8d67" stroke-dasharray="4 3"/><text x="1015" y="742" font-size="14" fill="#697b71" font-weight="400" text-anchor="start" >使用範圍</text><line x1="40" y1="776" x2="1240" y2="776" stroke="#d9e1d8" /><text x="40" y="804" font-size="15" fill="#697b71" font-weight="400" text-anchor="start" >介面概念示意，尚非已完成程式；數值為展示案例。</text></g></svg>