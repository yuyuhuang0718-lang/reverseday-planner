<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820" role="img" aria-label="家具使用空間預演器調整前後概念圖"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#697b71"/></marker><pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse"><path d="M25 0H0V25" fill="none" stroke="#e5e9e0" stroke-width=".7"/></pattern><pattern id="conflict" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#f5a996"/><line x1="0" y1="0" x2="0" y2="7" stroke="#cb5c44" stroke-width="2"/></pattern></defs><g font-family="Noto Sans CJK TC, sans-serif"><rect x="0" y="0" width="1280" height="820" rx="0" fill="#f7f6f0" stroke="none" /><text x="40" y="46" font-size="29" fill="#274c3e" font-weight="700" text-anchor="start" >買之前，先讓它住進你家</text><text x="40" y="80" font-size="18" fill="#697b71" font-weight="400" text-anchor="start" >使用空間預演｜同一個房間，調整前後的比較</text><rect x="1080" y="32" width="160" height="36" rx="18" fill="#e6ece2" stroke="none" /><text x="1160" y="56" font-size="15" fill="#274c3e" font-weight="600" text-anchor="middle" >2D 概念示意</text><rect x="40" y="116" width="580" height="560" rx="18" fill="white" stroke="#d9e1d8" /><rect x="660" y="116" width="580" height="560" rx="18" fill="white" stroke="#d9e1d8" /><text x="68" y="151" font-size="15" fill="#d96750" font-weight="700" text-anchor="start" >01 / 調整前</text><text x="688" y="151" font-size="15" fill="#274c3e" font-weight="700" text-anchor="start" >02 / 調整後</text><text x="68" y="184" font-size="23" fill="#263c34" font-weight="700" text-anchor="start" >櫃體放得下，抽屜卻受阻</text><text x="688" y="184" font-size="23" fill="#263c34" font-weight="700" text-anchor="start" >調整位置，保留完整拉出空間</text><rect x="105" y="238" width="450" height="375" rx="1" fill="#fbfcf8" stroke="#d9e1d8" stroke-width="3"/><rect x="105" y="238" width="450" height="375" rx="0" fill="ur